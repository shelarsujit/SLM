# ~100M parameter debug/pilot model.
# Use this to validate the full pipeline end-to-end (a few hours on one GPU,
# also runs on CPU for smoke tests) before committing money to a 1-2B run.
model:
  vocab_size: 32768
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  ffn_hidden: 2048
  seq_len: 1024
  tie_embeddings: true
  grad_checkpoint: false

train:
  data_dir: data/fineweb-edu
  out_dir: checkpoints/slm-100m
  micro_batch_size: 16
  grad_accum_steps: 8        # 16 * 8 * 1024 = 131k tokens/step
  max_steps: 20000           # ~2.6B tokens
  optimizer: adamw
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 700
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: bfloat16
  compile: true
  log_interval: 10
  eval_interval: 1000
  eval_steps: 100
  save_interval: 1000
  keep_checkpoints: 3
  wandb_project: ""          # set to enable wandb logging
