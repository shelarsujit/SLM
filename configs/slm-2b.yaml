# ~1.9B parameter model (2560 dim, 26 layers, GQA 20/4, head_dim 128).
# Realistic on a single 80GB GPU, or 2-4 GPUs with torchrun. On smaller
# cards use adamw8bit + micro_batch_size: 2.
model:
  vocab_size: 32768
  d_model: 2560
  n_layers: 26
  n_heads: 20
  n_kv_heads: 4
  ffn_hidden: 6912
  seq_len: 2048
  tie_embeddings: true
  grad_checkpoint: true

train:
  data_dir: data/fineweb-edu
  out_dir: checkpoints/slm-2b
  micro_batch_size: 4
  grad_accum_steps: 64       # 4 * 64 * 2048 = 524k tokens/step
  max_steps: 76000           # ~40B tokens (Chinchilla-optimal for 2B)
  optimizer: adamw
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 2000
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: bfloat16
  compile: true
  log_interval: 10
  eval_interval: 1000
  eval_steps: 100
  save_interval: 1000
  keep_checkpoints: 3
  wandb_project: ""
