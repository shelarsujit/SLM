model:
  vocab_size: 32000
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 12
  num_attention_heads: 12
  max_position_embeddings: 2048
  rms_norm_eps: 1e-6
  rope_theta: 10000.0
  tie_word_embeddings: true

data:
  dataset_name: "HuggingFaceFW/fineweb-edu"
  subset: "sample-10BT"
  streaming: true
  block_size: 2048
  buffer_size: 10000
  seed: 42

training:
  output_dir: "./checkpoints"
  run_name: "slm-140m"
  # Stage 1: 1 Billion Tokens. 
  # Batch size 16 * 2048 tokens = 32,768 tokens per step per GPU.
  # Grad accum 16 => Effective batch ~0.5M tokens.
  max_tokens: 1000000000 
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 16
  learning_rate: 6.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  save_steps: 1000
  logging_steps: 10
  eval_steps: 500
  dtype: "bf16"
  compile: true
  resume_from_checkpoint: null